<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scout</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="scout-app">
      <nav class="top-nav" aria-label="Scout navigation">
        <a class="back-link" href="#mission" aria-label="Back to mission">‹</a>
        <div class="progress-track" aria-label="Scout setup progress">
          <span class="progress-fill"></span>
        </div>
        <a class="brand-lockup" href="#mission" aria-label="Scout home">scout</a>
      </nav>

      <section id="mission" class="mission-screen">
        <div class="mascot-row">
          <div class="scout-mascot" aria-hidden="true">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="radar"></span>
          </div>
          <div class="speech-bubble">
            <p>Who should we scout first?</p>
          </div>
        </div>

        <form id="run-form" class="mission-form">
          <label for="url-input">Website URL</label>
          <div class="url-card">
            <input id="url-input" name="url" type="url" placeholder="https://example.com" required>
            <button type="submit">Run Scout</button>
          </div>
        </form>

        <section class="choice-section" aria-label="Scout mission options">
          <h1>Choose a mission</h1>
          <div class="choice-list">
            <button class="choice-card selected" type="button">
              <span class="choice-icon target"></span>
              <span>
                <strong>Find buyer accounts</strong>
                <small>Map high-fit companies</small>
              </span>
              <em>Recommended</em>
            </button>
            <button class="choice-card" type="button">
              <span class="choice-icon contact"></span>
              <span>
                <strong>Capture public contacts</strong>
                <small>Emails, phones, source pages</small>
              </span>
            </button>
            <button class="choice-card" type="button">
              <span class="choice-icon mail"></span>
              <span>
                <strong>Draft outreach</strong>
                <small>Review before sending</small>
              </span>
            </button>
          </div>
        </section>

        <section class="metrics-row" aria-label="Scout metrics">
          <article>
            <span id="run-status">Ready</span>
            <strong id="metric-leads">0</strong>
            <small>leads</small>
          </article>
          <article>
            <span>Accounts</span>
            <strong id="metric-companies">0</strong>
            <small>mapped</small>
          </article>
          <article>
            <span>Drafts</span>
            <strong id="metric-drafts">0</strong>
            <small>queued</small>
          </article>
        </section>
      </section>

      <section id="results" class="results-board">
        <div class="section-title">
          <p>Mission results</p>
          <h2>Pipeline ready for review</h2>
        </div>

        <div class="board-grid">
          <section class="panel leads-panel">
            <div class="panel-head">
              <span class="panel-icon leads"></span>
              <h3>Qualified leads</h3>
            </div>
            <div id="leads-body" class="lead-list"></div>
          </section>

          <section class="panel campaigns-panel">
            <div class="panel-head">
              <span class="panel-icon campaign"></span>
              <h3>Campaign</h3>
            </div>
            <div id="campaigns-list" class="campaign-list"></div>
            <button id="tick-button" class="secondary-button" type="button">Run scheduler</button>
          </section>

          <section class="panel queue-panel">
            <div class="panel-head">
              <span class="panel-icon queue"></span>
              <h3>Draft queue</h3>
            </div>
            <div id="drafts-list" class="draft-list"></div>
          </section>
        </div>
      </section>
    </main>

    <div class="bottom-cta">
      <a href="#results">Continue</a>
    </div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
